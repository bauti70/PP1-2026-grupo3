<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    
    <header class="page-catalogo">
        <p>BARRA DE NAVEGACION</p>
        <nav>
            <a href="index.html">Inicio</a>
            
            <div class="buscador-header">
                <input type="text" placeholder="¿A dónde vamos?">
            </div>

            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="contenedor-catalogo">
        <aside>

            <form>
                <strong>Filtros</strong><br>

                <label for="ubi">Ubicacion:</label>
                <input type="text" id="ubi"><br>

                <label for="entrada">Entrada:</label>
                <input type="date" id="entrada"><br>

                <label for="sali">Salida:</label>
                <input type="date" id="sali"><br>
                
                <div class="grupo-checkbox">
                    <input type="checkbox" id="wifi">
                    <label for="wifi">Wi-fi</label>
                </div>

                <div class="grupo-checkbox">
                    <input type="checkbox" id="des">
                    <label for="des">Desayuno</label>
                </div>

                <div class="grupo-checkbox">
                    <input type="checkbox" id="pile">
                    <label for="pile">Pileta</label>
                </div>

                <div class="grupo-checkbox">
                    <input type="checkbox" id="miento">
                    <label for="miento">Estacionamiento</label>
                </div><br>

                <p>Precio:</p>
                <label for="min">Minimo:</label>
                <input type="number" id="min"><br>
                <label for="max">Maximo:</label>
                <input type="number" id="max"><br>

                <input type="submit" value="Buscar">
            </form>
        </aside>

<section>
    <article class="tarjeta">
        <h3 class="tarjeta-titulo">Casa en la montaña</h3>
        <div class="tarjeta-contenido">
            <div class="tarjeta-imagen">
                <img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511?w=400" alt="Casa en la montaña">
            </div>
            <div class="tarjeta-info">
                <div class="tarjeta-texto">
                    <p class="tarjeta-ubicacion">📍 Bariloche, Rio Negro</p>
                    <p class="tarjeta-precio"><strong>$15.000</strong> / noche</p>
                </div>
                <a href="#" class="btn-detalles">Ver detalles</a>
            </div>
        </div>
    </article>

    <article class="tarjeta">
        <h3 class="tarjeta-titulo">Cabaña en el lago</h3>
        <div class="tarjeta-contenido">
            <div class="tarjeta-imagen">
                <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?w=400" alt="Cabaña en el lago">
            </div>
            <div class="tarjeta-info">
                <div class="tarjeta-texto">
                    <p class="tarjeta-ubicacion">📍 Cordoba, El Durazno</p>
                    <p class="tarjeta-precio"><strong>$12.500</strong> / noche</p>
                </div>
                <a href="#" class="btn-detalles">Ver detalles</a>
            </div>
        </div>
    </article>
    
    <article class="tarjeta tarjeta-horizontal">
        <h3 class="tarjeta-titulo">Departamento Céntrico</h3>
        <div class="tarjeta-contenido">
            <div class="tarjeta-imagen">
                <img src="https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=400" alt="Departamento Céntrico">
            </div>
            <div class="tarjeta-info">
                <div class="tarjeta-texto">
                    <p class="tarjeta-ubicacion">📍 Mendoza, Mendoza</p>
                    <p class="tarjeta-precio"><strong>$8.000</strong> / noche</p>
                </div>
                <a href="#" class="btn-detalles">Ver detalles</a>
            </div>
        </div>
    </article>
</section>
    </main>
</body>
</html>
