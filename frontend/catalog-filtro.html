<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Propiedades</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>

<body>
    
    <header class="page-catalogo">
        <p class="nav-titulo">BARRA DE NAVEGACION</p>
        <nav>
            <a href="index.html">Inicio</a>
            
            <search class="buscador-header">
                <input type="text" placeholder="¿A dónde vamos?" required>
            </search>

            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="contenedor-catalogo">
        
        <aside class="panel-filtros">
            <form>
                <fieldset class="grupo-filtros">
                    <legend class="titulo-filtro">Filtros</legend>

                    <label for="ubi">Ubicación:</label>
                    <input type="text" id="ubi">

                    <label for="entrada">Entrada:</label>
                    <input type="date" id="entrada">

                    <label for="sali">Salida:</label>
                    <input type="date" id="sali">
                    
                    <p class="subtitulo-filtro">Comodidades</p>
                    
                    <label class="opcion-check"><input type="checkbox" id="wifi"> Wi-fi</label>
                    <label class="opcion-check"><input type="checkbox" id="des"> Desayuno</label>
                    <label class="opcion-check"><input type="checkbox" id="pile"> Pileta</label>
                    <label class="opcion-check"><input type="checkbox" id="miento"> Estacionamiento</label>

                    <p class="subtitulo-filtro">Precio:</p>
                    
                    <label for="min">Mínimo:</label>
                    <input type="number" id="min">
                    
                    <label for="max">Máximo:</label>
                    <input type="number" id="max">

                    <input type="submit" value="Buscar" class="btn-buscar">
                </fieldset>
            </form>
        </aside>

        <section class="lista-tarjetas">
            
            <article class="tarjeta">
                <figure class="tarjeta-imagen">
                    <img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511?w=400" alt="Casa en la montaña">
                </figure>
                <section class="tarjeta-info">
                    <header>
                        <h3 class="tarjeta-titulo">Casa en la montaña</h3>
                    </header>
                    <p class="tarjeta-ubicacion">📍 Bariloche, Rio Negro</p>
                    <p class="tarjeta-precio"><strong>$15.000</strong> / noche</p>
                    <a href="#" class="btn-detalles">Ver detalles</a>
                </section>
            </article>

            <article class="tarjeta">
                <figure class="tarjeta-imagen">
                    <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?w=400" alt="Cabaña en el lago">
                </figure>
                <section class="tarjeta-info">
                    <header>
                        <h3 class="tarjeta-titulo">Cabaña en el lago</h3>
                    </header>
                    <p class="tarjeta-ubicacion">📍 Cordoba, El Durazno</p>
                    <p class="tarjeta-precio"><strong>$12.500</strong> / noche</p>
                    <a href="#" class="btn-detalles">Ver detalles</a>
                </section>
            </article>
            
            <article class="tarjeta">
                <figure class="tarjeta-imagen">
                    <img src="https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=400" alt="Departamento Céntrico">
                </figure>
                <section class="tarjeta-info">
                    <header>
                        <h3 class="tarjeta-titulo">Departamento Céntrico</h3>
                    </header>
                    <p class="tarjeta-ubicacion">📍 Mendoza, Mendoza</p>
                    <p class="tarjeta-precio"><strong>$8.000</strong> / noche</p>
                    <a href="#" class="btn-detalles">Ver detalles</a>
                </section>
            </article>

        </section>
    </main>
</body>
</html>
