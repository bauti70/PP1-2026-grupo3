<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Propiedades</title>
    <link rel="stylesheet" href="assents/css/global.css">
    <link rel="stylesheet" href="assents/css/catalog-filtro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="page-catalogo-body">
    
    <header class="barra-superior-fondo" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('../docs/2da-entrega/imagenes_referencia/inmacus-hdb-908121_1920.jpg');">
       
        <div class="nav-izquierda">
            <i class="fa-solid fa-bars icono-blanco"></i>
            <a href="index.html" class="icono-blanco" style="text-decoration: none;">
                <i class="fa-solid fa-house"></i>
            </a>
        </div>
        
        <div class="nav-centro">
            <form class="buscador-header" action="#" method="GET">
                <input type="text" placeholder="¿A dónde vamos?" required>
                <button type="submit" class="btn-lupa" title="Buscar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
        </div>

        <div class="nav-derecha">
            <a href="login.html" style="text-decoration: none; color: inherit;">
                <div class="icono-usuario">
                    <i class="fa-regular fa-user"></i>
                </div>
            </a>    
        </div>
        
    </header>

    <main class="contenedor-catalogo">
        <aside class="panel-filtros">
            <form id="form-filtros">
                <fieldset class="grupo-filtros">
                    <legend class="titulo-filtro"><i class="fa-solid fa-filter"></i> Filtros</legend>

                    <label for="ubi"><i class="fa-solid fa-location-dot"></i> Ubicación</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="text" id="ubi" placeholder="Ciudad, Provincia">
                    </div>

                    <label for="entrada"><i class="fa-regular fa-calendar"></i> Entrada</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-calendar"></i>
                        <input type="date" id="entrada">
                    </div>

                    <label for="sali"><i class="fa-regular fa-calendar-days"></i> Salida</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-calendar-days"></i>
                        <input type="date" id="sali">
                    </div>
                    
                    <div class="separador"></div>
                    
                    <label class="opcion-check"><input type="checkbox" id="wifi" checked> <i class="fa-solid fa-wifi"></i> Wi-Fi</label>
                    <label class="opcion-check"><input type="checkbox" id="des" checked> <i class="fa-solid fa-mug-hot"></i> Desayuno</label>
                    <label class="opcion-check"><input type="checkbox" id="pile" checked> <i class="fa-solid fa-water-ladder"></i> Pileta</label>
                    <label class="opcion-check"><input type="checkbox" id="miento" checked> <i class="fa-solid fa-square-parking"></i> Estacionamiento</label>

                    <div class="separador"></div>
                    <label><i class="fa-solid fa-dollar-sign"></i> Precio</label>
                    
                    <div class="contenedor-precios">
                        <div class="input-wrapper">
                            <span>$</span>
                            <input type="number" id="min" placeholder="Mínimo">
                        </div>
                        <div class="input-wrapper">
                            <span>$</span>
                            <input type="number" id="max" placeholder="Máximo">
                        </div>
                    </div>

                    <input type="submit" value="Buscar" class="btn-buscar">
                </fieldset>
            </form>
        </aside>

        <section class="lista-tarjetas">
            
            <div class="resultados-header">
                <h2>Resultados <span class="resultados-count">(12 alojamientos)</span></h2>
                <button class="btn-ordenar"><i class="fa-solid fa-arrow-up-short-wide"></i> Más relevantes <i class="fa-solid fa-chevron-down"></i></button>
            </div>

            <div id="lista-alojamientos" class="grilla-alojamientos">
                
                <!--
                <article class="tarjeta">
                    <div class="tarjeta-imagen-wrapper">
                        <img src="../docs/2da-entrega/imagenes_referencia/Casa en la montaña.jpg" alt="Casa en la montaña">
                        <i class="fa-regular fa-heart icono-favorito"></i>
                        <span class="badge-categoria">Casa</span>
                    </div>
                    <div class="tarjeta-cuerpo">
                        <div class="tarjeta-info-izq">
                            <h3 class="tarjeta-titulo">Casa en la montaña</h3>
                            <p class="tarjeta-ubicacion"><i class="fa-solid fa-location-dot"></i> Bariloche, Río Negro</p>
                        </div>
                        <div class="tarjeta-info-der">
                            <p class="tarjeta-precio"><strong>$15.000</strong> <span class="noche">/ noche</span></p>
                            <button class="btn-detalles">Button</button>
                        </div>
                    </div>
                </article>
                -->
            </div>    
        </section>
    </main>
    <script src="assents/js/catalogo.js"></script>
</body>
</html>

<script src="assents/js/catalogo.js"></script>
</body>

</html>
