<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Crear Cuenta</title>
        <link rel="stylesheet" href="assents/css/crear-cuenta.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    </head>
    <body class="page-cuenta">
        <header class="cuenta-header">
            <nav>
                <a href="#" class="icono-nav"><i class="fa-solid fa-bars"></i></a>
                
                <search class="buscador-crear-cuenta">
                    <input type="text" placeholder="¿A dónde vamos?" required>
                </search>
                <a href="index.html" class="icono-nav"><i class="fa-solid fa-house"></i></a>

            </nav>
        </header>


        <main>
            <h1 class="titulo-exterior">DISEÑEMOS TU CUENTA</h1>

            <form class="cuenta-contenedor-columnas" action="procesar.php" method="post">
                <div class="cuenta-columna-izquierda">  
                    <label class="cuenta-label" for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>  

                    <label class="cuenta-label" for="correo">Email</label>
                    <input type="email" id="correo" name="correo" required>

                    <label class="cuenta-label" for="clave">Crear contraseña</label>
                    <input type="password" id="clave" name="clave" required autocomplete="new-password">
                
                    <label class="cuenta-label" for="clave_rep">Ingresa nuevamente su contraseña</label>
                    <input type="password" id="clave_rep" name="clave_rep" required autocomplete="new-password">
                         
                    <p class="cuenta-texto-link">¿Ya tiene una cuenta? Ingrese al siguiente enlace: <a href="login.html">iniciar sesion</a></p>
                </div>

                <div class="cuenta-columna-derecha">
                    <p class="cuenta-titulo-roles"><strong>Seleccione que rol desea tomar:</strong></p>
                    
                    <select id="selector-rol" name="rol" class="cuenta-select">
                        <option value="anfitrion">Rol</option>
                        <option value="huesped">Huésped</option>
                    </select>
                    
                    <div class="cuenta-caja-info" id="caja-info-dinamica">
                    </div>

                    <button type="button" class="btn-crear-cuenta">CREAR CUENTA</button>
                </div>    
            </form>
        </main>     
        <script src="assents/js/crear-cuenta.js"></script>


    </body>
</html>
