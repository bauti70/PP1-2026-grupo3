<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Propiedad</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="assents/css/detallepropiedad.css">
    <link rel="stylesheet" href="assents/css/toastr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assents/css/menu.css">
</head>
<body>

<header class="barra-superior-fondo">
    <div class="nav-izquierda">
        <button type="button" class="btn-menu">
            <i class="fa-solid fa-bars icono-blanco" aria-hidden="true"></i>
            </button>
        <a href="index.html" class="icono-blanco" aria-label="Ir al inicio">
            <i class="fa-solid fa-house" aria-hidden="true"></i>
        </a>
    </div>
    <div class="nav-derecha">
        <a href="login.html" onclick="localStorage.setItem('volverA', 'detallepropiedad.html' + window.location.search)" aria-label="Iniciar sesión">
            <div class="icono-usuario">
                <i class="fa-regular fa-user" aria-hidden="true"></i>
            </div>
        </a>
    </div>
</header>

<main class="contenedor-detalle">

    <section class="info-propiedad">
        <p class="mensaje-detalle">Cargando alojamiento...</p>
    </section>

    <aside class="columna-reserva">
        <form id="form-reserva" class="tarjeta-reserva" novalidate>
            <div class="precio-encabezado">
                <h2>$0</h2> <span class="noche">/ noche</span>
            </div>

            <div class="seccion-form">
                <h3>Fechas</h3>
                <div class="contenedor-fechas">
                    <div class="caja-input">
                        <label for="llegada">Llegada</label>
                        <div class="input-con-icono">
                            <i class="fa-regular fa-calendar" aria-hidden="true"></i>
                            <input type="date" id="llegada" name="llegada">
                        </div>
                        <p id="error-llegada" class="mensaje-error" role="alert"></p>
                    </div>
                    <div class="caja-input">
                        <label for="salida">Salida</label>
                        <div class="input-con-icono">
                            <i class="fa-regular fa-calendar" aria-hidden="true"></i>
                            <input type="date" id="salida" name="salida">
                        </div>
                        <p id="error-salida" class="mensaje-error" role="alert"></p>
                    </div>
                </div>
            </div>

            <div class="seccion-form">
                <h3>Huéspedes</h3>
                <div class="caja-input input-huespedes">
                    <div class="input-con-icono">
                        <i class="fa-regular fa-user" aria-hidden="true"></i>
                        <input type="number" id="huespedes" name="huespedes" min="1" max="4" placeholder="Cantidad" value="">
                    </div>
                </div>
                <p id="error-huespedes" class="mensaje-error" role="alert"></p>
            </div>

            <div id="seccion-total" class="seccion-total" hidden>
                <h3>Total</h3>
                <div class="detalle-tarifa">
                    <p id="tarifa-texto" class="tarifa-texto"></p>
                    <div class="fila-valor">
                        <span>Total de la estadía</span>
                        <strong id="total-valor"></strong>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-confirmar">Reservar</button>

            <div id="mensaje-bloqueo" class="mensaje-bloqueo" hidden>
                <i class="fa-solid fa-lock" aria-hidden="true"></i>
                <p>Para reservar hace falta iniciar sesión.</p>
            </div>
        </form>

        <section id="lista-reservas"></section>
    </aside>
</main>

<script src="assents/js/jquery.min.js"></script>
<script src="assents/js/toastr.min.js"></script>
<script src="assents/js/detallepropiedad.js"></script>
<script src="assents/js/menu.js"></script> 

</body>
</html>
