<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas — Inicio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assents/css/inicio.css">
    <link rel="stylesheet" href="assents/css/menu.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <header class="page-catalogo">
        
        <nav class="nav-inicio" aria-label="Navegación principal">
            <div class="buscador-inicio">
                <button type="button" class="btn-menu">☰</button>
                
                <span id="nombre-usuario" class="nombre-usuario" hidden></span>
                <span id="etiqueta-rol" class="etiqueta-rol" hidden></span>
                <a href="login.html" id="enlace-login" class="enlace-usuario" aria-label="Iniciar sesión" title="Iniciar sesión">
                    <i class="fa-regular fa-user" aria-hidden="true"></i>
                </a>
            </div>
        </nav>
    </header>

    <main class="contenedor-inicio-galeria">

        <section class="bloque-buscador">
            <h1 class="titulo-gigante">¿A dónde vamos?</h1>

            <search class="buscador-central">
                <form id="form-busqueda-inicio" action="catalog-filtro.html" method="GET" novalidate>
                    <input type="search" id="input-busqueda" name="ciudad" placeholder="Escribí una ciudad..." aria-label="Ciudad del alojamiento" aria-describedby="error-busqueda" required>
                    <button type="submit" id="btn-buscar-inicio" class="btn-buscar-inicio">Buscar</button>
                </form>

                <p id="error-busqueda" class="error-busqueda" role="alert"></p>
            </search>
        </section>

        <section class="seccion-destacados" aria-labelledby="titulo-destacados">
            <h2 id="titulo-destacados" class="titulo-destacados">Destacados</h2>
            <p class="descripcion-destacados">Sugerencias de alojamientos con excelentes calificaciones.</p>

            <div id="lista-destacados" class="galeria-destinos" aria-live="polite"></div>
        </section>

    </main>

    <footer class="footer-inicio">
        <small>Grupo N° 3 — PP1 2026</small>
    </footer>

    <script src="assents/js/referencias-alojamientos.js"></script>
    <script src="assents/js/index.js"></script>
    <script src="assents/js/menu.js"></script> 

</body>
</html>
