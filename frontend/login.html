<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="assents/css/estilos.css">
</head>
<body>

  <header class="barra-superior">
    <h2>Login - Acceso alojamiento</h2>
  </header>

  <main class="caja-login">
    <form id="form-login" class="login-formulario">

      <label for="email">Ingresar Email</label>
      <input type="email" id="input-email" name="email">

      <br>

      <label for="password">Ingresar Contraseña</label>
      <input type="password" id="input-password" name="password">

      <br>

      <button class="boton-ingresar" type="submit">Ingresar</button>

      <br>

      <a href="#">¿Olvidaste tu contraseña?</a>
      <p id="error-login"></p>  
    </form>
  </main>

</body>
<script src="assents/js/login.js"></script>
</html>
