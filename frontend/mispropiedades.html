<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Propiedades</title>
    <link rel="stylesheet" href="assents/css/estilos.css">
</head>
<body>

<header class="page-catalogo">
        <p class="nav-titulo">BARRA DE NAVEGACION</p>
        <nav>
            <a href="index.html">Inicio</a>
            
            <search class="buscador-header">
                <input type="text" placeholder="¿A dónde vamos?" required>
            </search>

            <a href="login.html">Login</a>
        </nav>
    </header>
<main>
    <section>
        <h2>Mis propiedades</h2>
        <p id="mensaje-estado" style="font-weight: bold; margin: 15px 0;"></p>
        <div id="lista-mis-propiedades"></div>
    </section>

    <hr>

    <section>
        <h2>Editar alojamiento</h2>
        <form>
            <label for="titulo">Título</label><br>
            <input type="text" id="titulo" value="Apartamento vista al rio">
            <br><br>
            <label for="descripcion">Descripción</label><br>
            <textarea id="descripcion" rows="5" cols="50">Apartamento amplio para 4 personas con excelente vista., totalmente equipado. A pasos del Parque 3 de Febrero y con fácil acceso al transporte público. Ideal para familias o grupos pequeños.</textarea>
            <br><br>
            <label for="tarifa">Tarifa por noche</label><br>
            <input type="number" id="tarifa" value="45000">
            <br><br>
            <label for="capacidad">Capacidad</label><br>
            <input type="number" id="capacidad" value="4">
            <br><br>
            <h3>Servicios</h3>
            <input type="checkbox" id="wifi" checked>
            <label for="wifi">Wi-Fi</label>
            <input type="checkbox" id="pileta" checked>
            <label for="pileta">Pileta</label>
            <input type="checkbox" id="aire">
            <label for="aire">Aire acondicionado</label><br>

            <input type="checkbox" id="cochera" checked>
            <label for="cochera">Estacionamiento</label><br>

            <input type="checkbox" id="mascotas">
            <label for="mascotas">Acepta mascotas</label>

            <br><br>

            <button type="submit">Guardar cambios</button>
            <button type="reset">Cancelar</button>

        </form>

    </section>

</main>

<footer>
    
    <p>© 2026 - Sistema de Reservas</p>
</footer>

<script src="assents/js/mispropiedades.js"></script>

</body>
</html>
